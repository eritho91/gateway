server.port=9003
spring.application.name=jwt-gateway
app.auth-server-url=${AUTH_SERVICE_URL:http://localhost:9000}
app.product-service-url=${PRODUCT_SERVICE_URL:http://localhost:8084}
app.order-service-url=${ORDER_SERVICE_URL:http://localhost:8082}
## false for local development, true for produktion
app.cookie.secure=${COOKIE_SECURE:false}
## Controls when webbrowser can send cookies on call, lax according to pdf
app.cookie.same-site=${COOKIE_SAME_SITE:lax}
